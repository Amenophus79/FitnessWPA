name: Fitness PWA
version: "0.2.0"
slug: fitness_pwa
description: Offline-first training planner with SQLite and optional MariaDB replication
url: https://github.com/Amenophus79/home-assistant-fitness-pwa
image: ghcr.io/amenophus79/ha_fitnesswpa
arch:
  - aarch64
  - amd64
startup: application
boot: auto
backup: cold
webui: http://[HOST]:[PORT:3000]
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Fitness PWA web interface
services:
  - mysql:want
environment:
  LOCAL_DATA_DIR: /data
  MARIADB_DATABASE: homeassistant
options:
  openai_api_key: ""
  openai_model: gpt-5.2
  mariadb_user: ""
  mariadb_password: ""
schema:
  openai_api_key: password?
  openai_model: str
  mariadb_user: str?
  mariadb_password: password?
stage: experimental
