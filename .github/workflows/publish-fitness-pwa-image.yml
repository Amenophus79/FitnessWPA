name: Publish Fitness PWA image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/amenophus79/fitness-pwa

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !startsWith(github.ref_name, 'v0.') }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=
            NEXT_PUBLIC_SUPABASE_ANON_KEY=
