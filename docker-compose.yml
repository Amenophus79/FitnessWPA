services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      # Supabase and OpenAI are optional. Empty values keep the local app usable.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      LOCAL_DATA_DIR: ${LOCAL_DATA_CONTAINER_DIR:-/app/data}
    volumes:
      - .:/app
      - /app/node_modules
      - ${LOCAL_DATA_HOST_DIR:-./data}:${LOCAL_DATA_CONTAINER_DIR:-/app/data}
