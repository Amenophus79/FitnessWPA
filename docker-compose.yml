services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Supabase and OpenAI are optional. Empty values keep the local app usable.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      LOCAL_DATA_DIR: ${LOCAL_DATA_CONTAINER_DIR:-/app/data}
      MARIADB_HOST: ${MARIADB_HOST:-}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_USER: ${MARIADB_USER:-}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-homeassistant}
      MARIADB_SSL: ${MARIADB_SSL:-false}
    volumes:
      - ${LOCAL_DATA_HOST_DIR:-./data}:${LOCAL_DATA_CONTAINER_DIR:-/app/data}
